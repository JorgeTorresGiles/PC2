{% extends 'base.html' %}
{% block content %}
<div class="panel error-panel"><div class="error-number">{{ codigo }}</div><h1>{{ titulo }}</h1><p>{{ mensaje }}</p><a class="btn btn-primary" href="{{ url_for('dashboard') if usuario_actual else url_for('login') }}">← Volver al inicio</a></div>
{% endblock %}
{% block auth_content %}
<div class="panel error-panel auth-error"><div class="error-number">{{ codigo }}</div><h1>{{ titulo }}</h1><p>{{ mensaje }}</p><a class="btn btn-primary" href="{{ url_for('login') }}">← Volver al inicio</a></div>
{% endblock %}
